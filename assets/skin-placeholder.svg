<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">CS2 Skin Placeholder</title>
  <desc id="desc">Simple gradient card with a student-style label.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#grad)" />
  <g fill="#ffffff" font-family="Segoe UI, sans-serif" text-anchor="middle">
    <text x="200" y="180" font-size="28" font-weight="700">CS2 Skin</text>
    <text x="200" y="220" font-size="16" opacity="0.8">Preview Image</text>
  </g>
  <circle cx="320" cy="80" r="18" fill="#ffffff" opacity="0.3" />
  <circle cx="80" cy="320" r="26" fill="#ffffff" opacity="0.2" />
</svg>
